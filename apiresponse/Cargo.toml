[package]
name = "apiresponse"
version = "0.1.0"
edition = "2024"
description = "A flexible API response wrapper with framework-agnostic support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zhenglongbing/api-response"
keywords = ["api", "response", "axum", "actix", "poem"]
categories = ["web-programming"]

[features]
default = []
axum = ["dep:axum"]
actix = ["dep:actix-web"]
poem = ["dep:poem"]
full = ["axum", "actix", "poem"]

[dependencies]
apiresponse-macro = { version = "0.1", path = "../apiresponse-macro" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typed-builder = "0.23"

# Optional framework dependencies
axum = { version = "0.8", optional = true }
actix-web = { version = "4", optional = true }
poem = { version = "3", optional = true }

[dev-dependencies]
thiserror = "1.0"
