[package]
name = "apiresponse"
version = "0.2.2"
edition = "2024"
description = "A flexible API response wrapper with framework-agnostic support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loongsoldier/apiresponse"
documentation = "https://docs.rs/apiresponse"
readme = "README.md"
keywords = ["api", "response", "axum", "actix", "poem"]
categories = ["web-programming"]

[features]
default = []
axum = ["dep:axum"]
full = ["axum"]

[dependencies]
apiresponse-macro = { version = "0.2.2", path = "../apiresponse-macro" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Optional framework dependencies
axum = { version = "0.8", optional = true }
actix-web = { version = "4", optional = true }
poem = { version = "3", optional = true }

[dev-dependencies]
thiserror = "1.0"
