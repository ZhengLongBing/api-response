[package]
name = "apiresponse-macro"
version = "0.2.2"
edition = "2024"
description = "Derive macros for apiresponse"
license = "MIT OR Apache-2.0"
repository = "https://github.com/loongsoldier/apiresponse"
documentation = "https://docs.rs/apiresponse-macro"
readme = "README.md"
keywords = ["api", "response", "macro", "derive", "axum"]
categories = ["web-programming", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "extra-traits"] }
